<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  
const SUPABASE_URL = "https://tovhgdektjjujcwcdctl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4yI3xgqHCCn2HR6yuzXGxw_DfEX-h96";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let ustazRecords = [];
let currentAdminRole = null;

async function initializeAdmin() {
const {data:sessionData,error:sessionError} = await supabaseClient.auth.getSession();
const session = sessionData?.session;

if (sessionError || !session) {
window.location.replace("login.html");
return;
}

const {data:admin,error} = await supabaseClient
.from("admin_users")
.select("role,is_active")
.eq("user_id",session.user.id)
.maybeSingle();

if (error || !admin || !admin.is_active) {
alert("You do not have permission to access the Admin Panel.");
window.location.replace("dashboard.html");
return;
}

currentAdminRole = admin.role;

if (admin.role !== "super_admin") {
document.querySelector('[data-section="admins"]').style.display = "none";
document.getElementById("welcomeTitle").textContent = "Welcome, Admin";
} else {
document.getElementById("welcomeTitle").textContent = "Welcome, Super Admin";
}

document.getElementById("loading").style.display = "none";
document.getElementById("app").style.display = "block";
await loadUstazs();
}

const titles = {
overview:"Admin Overview",ustazs:"Ustaz Management",
students:"Student Management",schedule:"Schedule Management",
attendance:"Attendance Management",progress:"Weekly Progress",
penalties:"Penalties & Rules",reports:"Reports & Statistics",
admins:"Admin Management",settings:"Admin Settings",audit:"Audit History"
};

document.querySelectorAll(".nav-item").forEach(item => {
item.addEventListener("click", async () => {
const target = item.dataset.section;
document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
item.classList.add("active");
document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
document.getElementById(target).classList.add("active");
document.getElementById("pageTitle").textContent = titles[target];
if (target === "ustazs") await loadUstazs();
if (target === "audit") await loadAuditHistory();
closeSidebar();
});
});

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
document.getElementById("menuToggle")?.addEventListener("click", () => {
sidebar.classList.add("open");
overlay.classList.add("show");
});
function closeSidebar() {
sidebar.classList.remove("open");
overlay.classList.remove("show");
}
overlay.addEventListener("click",closeSidebar);

document.getElementById("logoutBtn").addEventListener("click",async()=>{
if (!confirm("Are you sure you want to log out?")) return;
await supabaseClient.auth.signOut();
window.location.replace("login.html");
});

function escapeHTML(value) {
return String(value ?? "").replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[char]);
}
function formatDate(value) {
if (!value) return "—";
const d = new Date(value);
return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
}
function showNotice(elementId,message,type) {
const el = document.getElementById(elementId);
el.textContent = message;
el.className = "notice " + type;
setTimeout(()=>{el.className="notice";el.textContent="";},6000);
}

async function managementAction(payload) {
const {data,error} = await supabaseClient.functions.invoke("manage-ustaz",{body:payload});
if (error) throw new Error(error.message || "Management request failed.");
if (data?.error) throw new Error(data.error);
if (!data?.success) throw new Error("The action could not be confirmed.");
return data;
}

async function loadUstazs() {
const tbody = document.getElementById("ustazTableBody");
tbody.innerHTML = '<tr><td colspan="8" class="table-message">Loading registrations...</td></tr>';

const {data,error} = await supabaseClient
.from("ustaz_registrations")
.select("id,full_name,gender,phone,email,approval_status,account_status,created_at,is_admin")
.eq("is_admin",false)
.order("created_at",{ascending:false});

if (error) {
tbody.innerHTML = `<tr><td colspan="8" class="table-message">${escapeHTML(error.message)}</td></tr>`;
showNotice("ustazNotice","Unable to load Ustaz registrations. Check database permissions.","error");
return;
}

ustazRecords = data || [];
updateStatistics();
renderUstazTable();
}

function updateStatistics() {
document.getElementById("totalUstazs").textContent = ustazRecords.length;
document.getElementById("pendingUstazs").textContent =
ustazRecords.filter(u=>u.approval_status==="pending").length;
document.getElementById("approvedUstazs").textContent =
ustazRecords.filter(u=>u.approval_status==="approved").length;
}

function renderUstazTable() {
const tbody = document.getElementById("ustazTableBody");
const search = document.getElementById("ustazSearch").value.trim().toLowerCase();
const approvalFilter = document.getElementById("ustazFilter").value;
const accountFilter = document.getElementById("accountFilter").value;

const filtered = ustazRecords.filter(u=>{
const text = `${u.full_name||""} ${u.email||""} ${u.phone||""}`.toLowerCase();
return text.includes(search) &&
(approvalFilter==="all" || u.approval_status===approvalFilter) &&
(accountFilter==="all" || (u.account_status||"active")===accountFilter);
});

if (!filtered.length) {
tbody.innerHTML = '<tr><td colspan="8" class="table-message">No matching Ustaz registrations found.</td></tr>';
document.getElementById("ustazResultCount").textContent = "Showing 0 registrations";
return;
}

tbody.innerHTML = filtered.map(u=>{
const approval = ["pending","approved","rejected"].includes(u.approval_status)
? u.approval_status : "pending";
const account = ["active","suspended","removed"].includes(u.account_status)
? u.account_status : "active";

let approvalButtons = "";
if (approval !== "approved") {
approvalButtons += `<button class="action-btn approve-btn" data-action="approved" data-id="${escapeHTML(u.id)}">Approve</button>`;
}
if (approval !== "rejected") {
approvalButtons += `<button class="action-btn reject-btn" data-action="rejected" data-id="${escapeHTML(u.id)}">Reject</button>`;
}

let accountButtons = "";
if (account === "active") {
accountButtons = `<button class="action-btn suspend-btn" data-action="suspend" data-id="${escapeHTML(u.id)}">Suspend</button>`;
} else if (account === "suspended") {
accountButtons = `<button class="action-btn reactivate-btn" data-action="reactivate" data-id="${escapeHTML(u.id)}">Reactivate</button>`;
}

let archiveButton = account !== "removed"
? `<button class="action-btn archive-btn" data-action="archive" data-id="${escapeHTML(u.id)}">Archive</button>` : "";

return `<tr>
<td>${escapeHTML(u.full_name)}</td>
<td>${escapeHTML(u.gender)}</td>
<td>${escapeHTML(u.phone)}</td>
<td>${escapeHTML(u.email)}</td>
<td>${formatDate(u.created_at)}</td>
<td><span class="status ${approval}">${approval.toUpperCase()}</span></td>
<td><span class="status ${account}">${account.toUpperCase()}</span></td>
<td><div class="action-group">
<button class="action-btn edit-btn" data-action="edit" data-id="${escapeHTML(u.id)}">Edit</button>
${approvalButtons}${accountButtons}${archiveButton}
</div></td>
</tr>`;
}).join("");

document.getElementById("ustazResultCount").textContent =
`Showing ${filtered.length} of ${ustazRecords.length} registrations`;
}

async function handleUstazAction(id,action) {
const record = ustazRecords.find(u=>u.id===id);
if (!record) return;

try {
if (action === "edit") {
if ((record.account_status||"active")==="removed") {
alert("Archived accounts cannot be edited.");
return;
}

const full_name = prompt("Full name:",record.full_name||"");
if (full_name === null) return;

const gender = prompt("Gender: enter Male or Female",record.gender||"");
if (gender === null) return;

const phone = prompt("Phone number in +251 format:",record.phone||"");
if (phone === null) return;

if (!full_name.trim() || !["Male","Female"].includes(gender.trim()) ||
!/^\+251[79][0-9]{8}$/.test(phone.trim())) {
alert("Invalid information. Name must contain at least two words, gender must be Male or Female, and phone must use +251 followed by 9 valid digits.");
return;
}

if (!confirm("Save these profile changes?")) return;

await managementAction({
action:"edit_profile",
target_user_id:id,
full_name:full_name.trim(),
gender:gender.trim(),
phone:phone.trim()
});
showNotice("ustazNotice","Ustaz profile updated.","success");

} else if (action==="approved" || action==="rejected") {
if (!confirm(`Are you sure you want to ${action==="approved"?"approve":"reject"} ${record.full_name}?`)) return;
await managementAction({
action:"set_approval",
target_user_id:id,
approval_status:action
});
showNotice("ustazNotice",`${record.full_name} approval status updated.`,"success");

} else if (action==="suspend") {
if (!confirm(`Suspend ${record.full_name}? They will lose account access.`)) return;
await managementAction({action:"suspend",target_user_id:id});
showNotice("ustazNotice",`${record.full_name} has been suspended.`,"success");

} else if (action==="reactivate") {
if (!confirm(`Reactivate ${record.full_name}?`)) return;
await managementAction({action:"reactivate",target_user_id:id});
showNotice("ustazNotice",`${record.full_name} has been reactivated.`,"success");

} else if (action==="archive") {
const confirmed = confirm(
`Archive ${record.full_name}?\n\nThis disables their account but does NOT delete their registration or historical records.`
);
if (!confirmed) return;
await managementAction({action:"archive",target_user_id:id});
showNotice("ustazNotice",`${record.full_name} has been archived. Historical records are retained.`,"success");
}

await loadUstazs();

} catch (error) {
showNotice("ustazNotice",error.message || "Action failed.","error");
}
}

document.getElementById("ustazTableBody").addEventListener("click",event=>{
const button = event.target.closest("button[data-action]");
if (!button) return;
handleUstazAction(button.dataset.id,button.dataset.action);
});

document.getElementById("ustazSearch").addEventListener("input",renderUstazTable);
document.getElementById("ustazFilter").addEventListener("change",renderUstazTable);
document.getElementById("accountFilter").addEventListener("change",renderUstazTable);
document.getElementById("refreshUstazs").addEventListener("click",loadUstazs);

async function loadAuditHistory() {
const tbody = document.getElementById("auditTableBody");
tbody.innerHTML = '<tr><td colspan="5" class="table-message">Loading audit history...</td></tr>';

const {data,error} = await supabaseClient
.from("admin_audit_logs")
.select("id,actor_user_id,action,target_user_id,details,created_at")
.order("created_at",{ascending:false})
.limit(200);

if (error) {
tbody.innerHTML = `<tr><td colspan="5" class="table-message">${escapeHTML(error.message)}</td></tr>`;
showNotice("auditNotice","Unable to load audit history. Check the audit table policy.","error");
return;
}

if (!data || !data.length) {
tbody.innerHTML = '<tr><td colspan="5" class="table-message">No audit records yet.</td></tr>';
return;
}

tbody.innerHTML = data.map(row=>`
<tr>
<td>${formatDate(row.created_at)}</td>
<td>${escapeHTML(row.action)}</td>
<td>${escapeHTML(row.target_user_id)}</td>
<td class="audit-details">${escapeHTML(JSON.stringify(row.details||{}))}</td>
<td>${escapeHTML(row.actor_user_id)}</td>
</tr>
`).join("");
}

document.getElementById("refreshAudit").addEventListener("click",loadAuditHistory);

initializeAdmin();
</script>
</body>
</html>
