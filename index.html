<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ኢቅራኔት መድረሳ | IqraNET MEDRESA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
    font-family: "Noto Sans Ethiopic", Arial, sans-serif;
}

/* HEADER */
header {
    height: 130px;
    background: #091345;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 10px 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.header-logo {
    width: 105px;
    height: 105px;
    object-fit: contain;
}

.brand-text {
    color: white;
    line-height: 1.65;
}

.brand-text .amharic {
    font-size: 18px;
    font-weight: bold;
}

.brand-text .english {
    font-family: Georgia, serif;
    font-size: 17px;
}

.login-small {
    position: absolute;
    right: 4%;
    top: 50%;
    transform: translateY(-50%);
    background: #73c9c0;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    padding: 9px 17px;
    font-size: 14px;
    font-weight: bold;
}

/* MAIN BACKGROUND */
main {
    min-height: 695px;
    background: linear-gradient(
        to bottom,
        #f5fcfb 0%,
        #c8eeea 35%,
        #9bded5 68%,
        #69c7bd 100%
    );
    text-align: center;
    padding: 78px 20px 35px;
}

/* WELCOME HEADING */
.welcome-title {
    max-width: 850px;
    margin: 0 auto;
    color: #050505;
    font-size: clamp(24px, 3.3vw, 35px);
    font-weight: 800;
    line-height: 1.65;
}

/* MAIN LOGIN BUTTON */
.login-main {
    display: inline-block;
    margin-top: 65px;
    background: #091345;
    color: white;
    text-decoration: none;
    border-radius: 26px;
    padding: 18px 45px;
    font-size: 29px;
    font-weight: bold;
    transition: 0.2s;
}

.login-main:hover {
    background: #142765;
    transform: translateY(-2px);
}

/* VIDEO SECTION */
.video-section {
    margin-top: 120px;
}

.video-section h2 {
    font-size: 25px;
    color: #050505;
    font-weight: bold;
    margin-bottom: 35px;
}

.play-button {
    width: 69px;
    height: 56px;
    border: none;
    border-radius: 14px;
    background: #091345;
    color: white;
    font-size: 32px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* TELEGRAM FLOATING ICON */
.telegram {
    position: absolute;
    right: 4.8%;
    margin-top: 35px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #279dd5;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-decoration: none;
    font-size: 25px;
}

/* FOOTER */
footer {
    min-height: 175px;
    background: #091345;
    color: white;
    text-align: center;
    padding: 18px 15px 12px;
}

.footer-logo {
    width: 95px;
    height: 85px;
    object-fit: contain;
    display: block;
    margin: 0 auto 7px;
}

.socials {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-bottom: 5px;
}

.socials a {
    width: 21px;
    height: 21px;
    border: 1.5px solid white;
    border-radius: 4px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

.footer-handle {
    font-family: Georgia, serif;
    font-size: 12px;
    color: white;
}

/* MOBILE */
@media(max-width: 600px) {
    header {
        height: 110px;
        justify-content: flex-start;
        padding-left: 12px;
    }

    .header-logo {
        width: 75px;
        height: 80px;
    }

    .brand {
        gap: 5px;
    }

    .brand-text .amharic {
        font-size: 14px;
    }

    .brand-text .english {
        font-size: 14px;
    }

    .login-small {
        right: 10px;
        padding: 8px 12px;
        font-size: 12px;
    }

    main {
        min-height: 695px;
        padding: 65px 14px 30px;
    }

    .welcome-title {
        font-size: 23px;
        line-height: 1.8;
    }

    .login-main {
        margin-top: 60px;
        padding: 16px 35px;
        font-size: 24px;
    }

    .video-section {
        margin-top: 120px;
    }

    .video-section h2 {
        font-size: 20px;
    }

    .telegram {
        right: 5%;
        margin-top: 30px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="brand">
        <img
            class="header-logo"
            src="https://i.ibb.co/kVjfrCdP/5-removebg-preview.png"
            alt="IqraNET Logo"
        >

        <div class="brand-text">
            <div class="amharic">ኢቅራኔት መድረሳ</div>
            <div class="english">IqraNET MEDRESA</div>
        </div>
    </div>

    <a href="login.html" class="login-small">
        ♙ ግባ
    </a>

</header>

<!-- MAIN -->
<main>

    <h1 class="welcome-title">
        ለኢቅራኔት መድረሳ አባላትና የተማሪዎች
        አትንዳንስ መቆጣጠሪያ ድረ ገጽ
    </h1>

    <a href="login.html" class="login-main">
        ለመግባት
    </a>

    <section class="video-section">

        <h2>
            ስለ መድረሳው አጭር ስፖት ለመመልከት
        </h2>

        <button class="play-button" type="button"
            aria-label="Introduction video">
            ▶
        </button>

    </section>

    <a href="#" class="telegram" aria-label="Telegram">
        ➤
    </a>

</main>

<!-- FOOTER -->
<footer>

    <img
        class="footer-logo"
        src="https://i.ibb.co/q31WJkdv/6-removebg-preview.png"
        alt="IqraNET Footer Logo"
    >

    <div class="socials">
        <a href="#" aria-label="Instagram">◎</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="Telegram">➤</a>
        <a href="#" aria-label="TikTok">♪</a>
        <a href="#" aria-label="YouTube">▶</a>
    </div>

    <div class="footer-handle">
        @IqraNet
    </div>

</footer>

</body>
</html>
