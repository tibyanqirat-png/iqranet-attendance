<!DOCTYPE html>
<html lang="am">
<meta name="google-site-verification" content="VcEyKS10EJyUD2pTuswM82SsaWoUSEDRCSV-VNoje8c" />
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ኢቅራኔት መድረሳ | IqraNet Medresa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e8fff5, #b8f2e2, #70d9cb);
    color: #091345;
}

/* HEADER */
header {
    width: 100%;
    min-height: 95px;
    padding: 12px 6%;
    background: #091345;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
}

.brand-text {
    color: white;
    text-align: left;
}

.brand-text h2 {
    font-size: 23px;
    margin-bottom: 4px;
}

.brand-text span {
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: bold;
}

.header-login {
    text-decoration: none;
    color: #091345;
    background: white;
    padding: 10px 24px;
    border-radius: 25px;
    font-weight: bold;
    transition: 0.3s;
}

.header-login:hover {
    background: #d9f5ed;
}

/* MAIN */
main {
    min-height: 540px;
    padding: 85px 20px 60px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    max-width: 950px;
    font-size: clamp(25px, 4vw, 38px);
    line-height: 1.8;
    margin-bottom: 35px;
    color: #091345;
}

.main-login {
    display: inline-block;
    background: #091345;
    color: white;
    text-decoration: none;
    padding: 15px 55px;
    border-radius: 35px;
    font-size: 19px;
    font-weight: bold;
    transition: 0.3s;
}

.main-login:hover {
    background: #172568;
    transform: translateY(-3px);
}

/* VIDEO */
.video-section {
    text-align: center;
    padding: 25px 20px 75px;
}

.video-section h2 {
    font-size: clamp(19px, 3vw, 27px);
    margin-bottom: 25px;
    color: #091345;
}

.video-button {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: none;
    background: #091345;
    color: white;
    font-size: 27px;
    cursor: pointer;
    transition: 0.3s;
}

.video-button:hover {
    transform: scale(1.1);
    background: #172568;
}

/* FLOATING TELEGRAM */
.telegram-float {
    position: fixed;
    right: 22px;
    bottom: 25px;
    width: 58px;
    height: 58px;
    background: #229ED9;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 9999;
    animation: telegramFloat 2.5s ease-in-out infinite;
}

.telegram-float:hover {
    animation-play-state: paused;
    transform: scale(1.12);
}

@keyframes telegramFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-12px);
    }
}

/* FOOTER */
footer {
    background: #091345;
    color: white;
    text-align: center;
    padding: 30px 20px 25px;
}

.footer-logo {
    width: 85px;
    height: 85px;
    object-fit: contain;
    margin-bottom: 12px;
}

/* SOCIAL ICONS */
.socials {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    flex-wrap: wrap;
}

.socials a {
    width: 34px;
    height: 34px;
    background: white;
    color: #6b4c9a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    text-decoration: none;
    transition: 0.3s;
}

.socials a:hover {
    transform: translateY(-4px);
}

footer p {
    font-size: 14px;
    margin-top: 10px;
}

/* MOBILE */
@media (max-width: 600px) {
    header {
        min-height: 80px;
        padding: 10px 4%;
    }

    .header-logo {
        width: 62px;
        height: 62px;
    }

    .brand-text h2 {
        font-size: 18px;
    }

    .brand-text span {
        font-size: 11px;
        letter-spacing: 1px;
    }

    .header-brand {
        gap: 8px;
    }

    .header-login {
        padding: 9px 16px;
        font-size: 13px;
    }

    main {
        min-height: 460px;
        padding-top: 65px;
    }

    .telegram-float {
        right: 15px;
        bottom: 18px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="header-brand">
        <img
            src="https://i.ibb.co/kVjfrCdP/5-removebg-preview.png"
            alt="IqraNet Logo"
            class="header-logo"
        >

        <div class="brand-text">
            <h2>ኢቅራኔት መድረሳ</h2>
            <span>IqraNET MEDRESA</span>
        </div>
    </div>

    <a href="login.html" class="header-login">ግባ</a>
</header>

<!-- MAIN CONTENT -->
<main>
    <h1>
        ለኢቅራኔት መድረሳ ኡስታዞች የተዘጋጀ የተማሪዎች አቴንዳንስ መቆጣጠሪያ ድህረ ገፅ
    </h1>

    <a href="register.html" class="main-login">ለመመዝገብ</a>
</main>

<!-- VIDEO SECTION -->
<section class="video-section">
    <h2>ስለ ምዝገባው አጋዥ ቪዲዮ ለመመልከት</h2>

    <button class="video-button" type="button" aria-label="Play video">
        <i class="fa-solid fa-play"></i>
    </button>
</section>

<!-- FLOATING TELEGRAM ICON -->
<a href="#" class="telegram-float" aria-label="Telegram">
    <i class="fa-brands fa-telegram"></i>
</a>

<!-- FOOTER -->
<footer>
    <img
        src="https://i.ibb.co/q31WJkdv/6-removebg-preview.png"
        alt="IqraNet Logo"
        class="footer-logo"
    >

    <div class="socials">
        <a href="#" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="#" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a href="#" aria-label="Telegram">
            <i class="fa-brands fa-telegram"></i>
        </a>

        <a href="#" aria-label="TikTok">
            <i class="fa-brands fa-tiktok"></i>
        </a>

        <a href="#" aria-label="YouTube">
            <i class="fa-brands fa-youtube"></i>
        </a>
    </div>

    <p>© 2026 IqraNet Medresa. All Rights Reserved.</p>
    <p>@IqraNet</p>
</footer>

</body>
</html>
