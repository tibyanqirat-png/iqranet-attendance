
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IqraNet | Student Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
    --navy:#091345;
    --teal:#20bfa9;
    --text:#17233f;
    --muted:#718096;
    --border:#e4e9f1;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
    font-family:Arial,sans-serif;
    background:#f3f7fb;
    color:var(--text);
    padding:25px;
}
.container { max-width:1150px; margin:auto; }
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}
h1 { color:var(--navy); font-size:25px; }
.subtitle { color:var(--muted); font-size:13px; margin-top:6px; }
button,input,select { font:inherit; }
button {
    border:0;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
}
.primary { background:var(--navy); color:white; }
.secondary { background:#e8edf5; color:var(--navy); }
.danger { background:#fee2e2; color:#b91c1c; }
.success { background:#dcfce7; color:#166534; }
.tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.tabs button { background:#e5eaf2; color:var(--navy); }
.tabs button.active { background:var(--teal); }
.panel {
    background:white;
    border:1px solid var(--border);
    border-radius:13px;
    padding:22px;
    margin-bottom:20px;
}
.panel h2 { font-size:18px; margin-bottom:18px; color:var(--navy); }
.form-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
}
.field { display:flex; flex-direction:column; gap:7px; }
.field label { font-size:13px; font-weight:bold; }
.field input,.field select {
    width:100%;
    padding:12px;
    border:1px solid #d5dce7;
    border-radius:8px;
    background:white;
    color:var(--text);
}
.days {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:5px;
}
.days label {
    display:flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    font-weight:normal;
}
.form-actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
.toolbar {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}
.toolbar input {
    flex:1;
    min-width:180px;
    padding:12px;
    border:1px solid #d5dce7;
    border-radius:8px;
}
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:750px; }
th,td {
    padding:13px 10px;
    text-align:left;
    border-bottom:1px solid var(--border);
    font-size:13px;
}
th { background:#f5f8fc; color:var(--navy); }
td { color:var(--muted); }
.actions { display:flex; gap:7px; }
.actions button { padding:8px 10px; font-size:12px; }
.empty { text-align:center; padding:30px; color:var(--muted); }
.hidden { display:none !important; }
.message { margin-top:14px; font-size:13px; line-height:1.5; }
.message.error { color:#b91c1c; }
.message.ok { color:#15803d; }
small { color:var(--muted); }
@media(max-width:650px) {
    body { padding:14px; }
    .form-grid { grid-template-columns:1fr; }
    .panel { padding:16px; }
    h1 { font-size:21px; }
}
</style>
</head>

<body>
<div class="container">

<header>
    <div>
        <h1><i class="fa-solid fa-users"></i> Student Management</h1>
        <p class="subtitle">IqraNet Medresa · Admin Portal</p>
    </div>
    <button class="secondary" onclick="location.href='admin.html'">
        <i class="fa-solid fa-arrow-left"></i> Admin Panel
    </button>
</header>

<div class="tabs">
    <button id="activeTab" class="active" onclick="showTab('active')">Active Students</button>
    <button id="archivedTab" onclick="showTab('archived')">Archived Students</button>
</div>

<section class="panel" id="formPanel">
    <h2 id="formTitle">Add New Student</h2>

    <form id="studentForm">
        <div class="form-grid">

            <div class="field">
                <label for="studentCode">Existing Student Code</label>
                <input id="studentCode" required placeholder="e.g. S001">
            </div>

            <div class="field">
                <label for="fullName">Student Full Name</label>
                <input id="fullName" required placeholder="Student full name">
            </div>

            <div class="field">
                <label for="ustazSelect">Assigned Ustaz</label>
                <select id="ustazSelect" required>
                    <option value="">Loading Ustazs...</option>
                </select>
            </div>

            <div class="field">
                <label for="lessonTime">Lesson Starting Time</label>
                <input id="lessonTime" type="time" required>
            </div>

            <div class="field">
                <label>Learning Days</label>
                <div class="days" id="learningDays">
                    <label><input type="checkbox" value="Monday"> Mon</label>
                    <label><input type="checkbox" value="Tuesday"> Tue</label>
                    <label><input type="checkbox" value="Wednesday"> Wed</label>
                    <label><input type="checkbox" value="Thursday"> Thu</label>
                    <label><input type="checkbox" value="Friday"> Fri</label>
                    <label><input type="checkbox" value="Saturday"> Sat</label>
                    <label><input type="checkbox" value="Sunday"> Sun</label>
                </div>
            </div>

            <div class="field">
                <label>Free Days</label>
                <div class="days" id="freeDays">
                    <label><input type="checkbox" value="Monday"> Mon</label>
                    <label><input type="checkbox" value="Tuesday"> Tue</label>
                    <label><input type="checkbox" value="Wednesday"> Wed</label>
                    <label><input type="checkbox" value="Thursday"> Thu</label>
                    <label><input type="checkbox" value="Friday"> Fri</label>
                    <label><input type="checkbox" value="Saturday"> Sat</label>
                    <label><input type="checkbox" value="Sunday"> Sun</label>
                </div>
            </div>

        </div>

        <div class="form-actions">
            <button class="primary" type="submit" id="saveBtn">Add Student</button>
            <button class="secondary hidden" type="button" id="cancelEdit" onclick="resetForm()">Cancel</button>
        </div>
        <p id="formMessage" class="message"></p>
    </form>
</section>

<section class="panel">
    <h2 id="tableTitle">Active Students</h2>

    <div class="toolbar">
        <input id="searchInput" placeholder="Search by student name or code..." oninput="renderStudents()">
        <button class="secondary" onclick="loadStudents()">
            <i class="fa-solid fa-rotate"></i> Refresh
        </button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Student Code</th>
                    <th>Full Name</th>
                    <th>Assigned Ustaz</th>
                    <th>Learning Days</th>
                    <th>Free Days</th>
                    <th>Starting Time</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsBody">
                <tr><td colspan="7" class="empty">Loading students...</td></tr>
            </tbody>
        </table>
    </div>
</section>

</div>

<script>
const SUPABASE_URL = "https://tovhgdektjjujcwcdctl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4yI3xgqHCCn2HR6yuzXGxw_DfEX-h96";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let students = [];
let ustazs = [];
let currentTab = "active";
let editingId = null;

const $ = id => document.getElementById(id);

async function initialize() {
    const { data: sessionData, error: sessionError } =
        await db.auth.getSession();

    const session = sessionData?.session;

    if (sessionError || !session) {
        location.replace("login.html");
        return;
    }

    const { data: admin, error } = await db
        .from("admin_users")
        .select("role,is_active")
        .eq("user_id", session.user.id)
        .maybeSingle();

    if (error || !admin || !admin.is_active) {
        alert("Admin access required.");
        location.replace("dashboard.html");
        return;
    }

    await loadUstazs();
    await loadStudents();
}

async function loadUstazs() {
    const select = $("ustazSelect");
    select.innerHTML = '<option value="">Select Ustaz</option>';

    const { data, error } = await db
        .from("ustaz_registrations")
        .select("id,full_name,gender")
        .eq("approval_status", "approved")
        .eq("account_status", "active")
        .eq("is_admin", false)
        .order("full_name");

    if (error) {
        select.innerHTML = '<option value="">Could not load Ustazs</option>';
        showMessage(error.message, true);
        return;
    }

    ustazs = data || [];

    ustazs.forEach(u => {
        const option = document.createElement("option");
        option.value = u.id;
        option.textContent = u.full_name + (u.gender ? " (" + u.gender + ")" : "");
        select.appendChild(option);
    });
}

async function loadStudents() {
    $("studentsBody").innerHTML =
        '<tr><td colspan="7" class="empty">Loading...</td></tr>';

    const { data, error } = await db
        .from("students")
        .select("id,student_code,full_name,ustaz_id,learning_days,free_days,lesson_start_time,is_active")
        .order("created_at", { ascending: false });

    if (error) {
        $("studentsBody").innerHTML =
            '<tr><td colspan="7" class="empty">Could not load students: ' +
            escapeHTML(error.message) + '</td></tr>';
        return;
    }

    students = data || [];
    renderStudents();
}

function renderStudents() {
    const search = $("searchInput").value.trim().toLowerCase();

    const filtered = students.filter(s =>
        s.is_active === (currentTab === "active") &&
        ((s.full_name || "").toLowerCase().includes(search) ||
         (s.student_code || "").toLowerCase().includes(search))
    );

    $("tableTitle").textContent =
        currentTab === "active" ? "Active Students" : "Archived Students";

    if (!filtered.length) {
        $("studentsBody").innerHTML =
            '<tr><td colspan="7" class="empty">No students found.</td></tr>';
        return;
    }

    $("studentsBody").innerHTML = filtered.map(s => {
        const ustaz = ustazs.find(u => u.id === s.ustaz_id);
        const ustazName = ustaz ? ustaz.full_name : "Unknown Ustaz";

        return `
        <tr>
            <td>${escapeHTML(s.student_code)}</td>
            <td>${escapeHTML(s.full_name)}</td>
            <td>${escapeHTML(ustazName)}</td>
            <td>${escapeHTML((s.learning_days || []).join(", "))}</td>
            <td>${escapeHTML((s.free_days || []).join(", ") || "None")}</td>
            <td>${escapeHTML(String(s.lesson_start_time || "").slice(0,5))}</td>
            <td>
                <div class="actions">
                    ${currentTab === "active"
                    ? `<button class="secondary" onclick="editStudent('${s.id}')">Edit</button>
                       <button class="danger" onclick="archiveStudent('${s.id}')">Archive</button>`
                    : `<button class="success" onclick="restoreStudent('${s.id}')">Restore</button>`}
                </div>
            </td>
        </tr>`;
    }).join("");
}

async function saveStudent(event) {
    event.preventDefault();

    const code = $("studentCode").value.trim();
    const name = $("fullName").value.trim();
    const ustazId = $("ustazSelect").value;
    const time = $("lessonTime").value;

    const learning = getChecked("learningDays");
    const free = getChecked("freeDays");

    if (!code || !name || !ustazId || !time) {
        showMessage("Please complete all required fields.", true);
        return;
    }

    if (!learning.length) {
        showMessage("Select at least one learning day.", true);
        return;
    }

    if (learning.some(day => free.includes(day))) {
        showMessage("A day cannot be both a learning day and a free day.", true);
        return;
    }

    const record = {
        student_code: code,
        full_name: name,
        ustaz_id: ustazId,
        learning_days: learning,
        free_days: free,
        lesson_start_time: time
    };

    $("saveBtn").disabled = true;
    $("saveBtn").textContent = "Saving...";

    let result;

    if (editingId) {
        result = await db.from("students")
            .update(record)
            .eq("id", editingId)
            .select();
    } else {
        result = await db.from("students")
            .insert(record)
            .select();
    }

    $("saveBtn").disabled = false;
    $("saveBtn").textContent = editingId ? "Save Changes" : "Add Student";

    if (result.error) {
        showMessage(result.error.message, true);
        return;
    }

    showMessage(editingId ? "Student updated successfully." : "Student added successfully.", false);
    resetForm();
    await loadStudents();
}

function editStudent(id) {
    const s = students.find(x => x.id === id);
    if (!s) return;

    editingId = id;
    $("formTitle").textContent = "Edit Student";
    $("saveBtn").textContent = "Save Changes";
    $("cancelEdit").classList.remove("hidden");

    $("studentCode").value = s.student_code;
    $("fullName").value = s.full_name;
    $("ustazSelect").value = s.ustaz_id;
    $("lessonTime").value = String(s.lesson_start_time || "").slice(0,5);

    setChecked("learningDays", s.learning_days || []);
    setChecked("freeDays", s.free_days || []);

    $("formPanel").scrollIntoView({ behavior:"smooth" });
}

async function archiveStudent(id) {
    const s = students.find(x => x.id === id);
    if (!s || !confirm("Archive " + s.full_name + "? Attendance history will be preserved.")) return;

    const { error } = await db
        .from("students")
        .update({ is_active:false, updated_at:new Date().toISOString() })
        .eq("id", id);

    if (error) {
        alert(error.message);
        return;
    }

    await loadStudents();
}

async function restoreStudent(id) {
    const s = students.find(x => x.id === id);
    if (!s || !confirm("Restore " + s.full_name + "?")) return;

    const { error } = await db
        .from("students")
        .update({ is_active:true, updated_at:new Date().toISOString() })
        .eq("id", id);

    if (error) {
        alert(error.message);
        return;
    }

    await loadStudents();
}

function showTab(tab) {
    currentTab = tab;

    $("activeTab").classList.toggle("active", tab === "active");
    $("archivedTab").classList.toggle("active", tab === "archived");

    $("formPanel").classList.toggle("hidden", tab !== "active");

    if (tab === "archived" && editingId) resetForm();

    renderStudents();
}

function getChecked(id) {
    return [...$(id).querySelectorAll('input[type="checkbox"]:checked')]
        .map(input => input.value);
}

function setChecked(id, values) {
    $(id).querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.checked = values.includes(input.value);
    });
}

function resetForm() {
    editingId = null;
    $("studentForm").reset();
    setChecked("learningDays", []);
    setChecked("freeDays", []);
    $("formTitle").textContent = "Add New Student";
    $("saveBtn").textContent = "Add Student";
    $("cancelEdit").classList.add("hidden");
    $("formMessage").textContent = "";
}

function showMessage(message, isError) {
    $("formMessage").textContent = message;
    $("formMessage").className = "message " + (isError ? "error" : "ok");
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

$("studentForm").addEventListener("submit", saveStudent);

initialize();
</script>
</body>
</html>
